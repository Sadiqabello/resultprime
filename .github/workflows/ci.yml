name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    # Dummy values so config/env.ts (which validates at import) passes during
    # test/build. These are NOT secrets — they only need to satisfy the schema;
    # CI never reaches a real Supabase project. Real secrets live in the host.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      NEXT_PUBLIC_APP_URL: https://app.example.com
      NEXT_PUBLIC_ROOT_DOMAIN: example.com
      CRON_SECRET: ci-cron-secret-0123456789
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  rls:
    name: RLS tenant-isolation (real Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Boots local Postgres and applies supabase/migrations/* + seed.sql.
      - name: Start Supabase
        run: supabase start

      - name: Export Supabase test env
        run: |
          {
            echo "SUPABASE_URL=$(supabase status -o json | jq -r '.API_URL')"
            echo "SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')"
          } >> "$GITHUB_ENV"

      # The suite is the backstop the whole multi-tenant model rests on: it proves
      # one school's JWT can never read or write another school's rows (§20.2).
      - name: RLS isolation tests
        env:
          RLS_TEST: "1"
        run: npm run test:rls

      - name: Stop Supabase
        if: always()
        run: supabase stop
